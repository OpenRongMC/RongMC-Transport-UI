<!doctype html>
<html><head><meta charset="utf-8"><title>Transport controls</title>
<style>
body { margin: 0; background: transparent; }
.control { position: absolute; box-sizing: border-box; border: 1px solid #090c13; background: #414756; box-shadow: inset 0px 2px #697282, inset 0px -2px #272b36; }
.highlighted { background: #326351; box-shadow: inset 0px 2px #7bceb0, inset 0px -2px #234336; }
.disabled { background: #2b2f39; box-shadow: inset 0px 1px #434a57; }
</style></head>
<body><div id="controls"></div><script src="controls.js"></script></body></html>
